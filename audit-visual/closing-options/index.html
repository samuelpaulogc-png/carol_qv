<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encerramento + rodapé — variações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080C22;--bg-2:#0C1236;--surface:#141C4A;--line:#2A3574;--cream:#ECF0F8;--muted:#8794AC;--muted-2:#5C6889;--mint:#2AD2C1;--mint-bright:#45E4D3;--mint-deep:#1AA99B;--virada:#00FB8A;--copy-readable:rgba(236,240,248,.82);--ease-out:cubic-bezier(.22,1,.36,1);--maxw:1160px;--section-space:clamp(64px,6.1vw,88px)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--cream);font-family:'Hanken Grotesk',sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img,svg{display:block;max-width:100%}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* ===== moldura do comparador ===== */
  .intro{padding:32px 0 18px}
  .intro h1{font-family:'Bricolage Grotesque',sans-serif;font-size:1.375rem;font-weight:600;margin-bottom:6px}
  .intro p{color:var(--muted);font-size:.9375rem;max-width:860px}
  .picker{position:sticky;top:0;z-index:30;background:rgba(8,12,34,.92);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
  .picker .wrap{display:flex;align-items:center;gap:10px 14px;padding-block:10px;overflow-x:auto;scrollbar-width:none}
  .picker .wrap::-webkit-scrollbar{display:none}
  .picker p{flex:none;font-size:.8125rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .picker div{display:flex;gap:8px}
  .picker button{flex:none;white-space:nowrap;font:inherit;font-size:.875rem;color:var(--cream);background:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
  .picker button b{color:var(--mint-bright);margin-right:6px}
  .picker button:hover{border-color:var(--mint-deep)}
  .picker button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#06122E}
  .picker button[aria-pressed="true"] b{color:#06122E}
  .picker button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
  .note{max-width:var(--maxw);margin:0 auto;padding:14px 24px;color:var(--muted);font-size:.875rem;min-height:48px}
  .faq-tail{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.875rem;text-align:center}
  @media (max-width:560px){.picker p{display:none}}

  /* ===== base comum ===== */
  h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
  .serif{font-family:'Fraunces',serif;font-style:italic;font-weight:500;color:var(--mint-bright)}
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;color:#06122E;background:linear-gradient(180deg,var(--mint-bright),var(--mint) 55%,var(--mint-deep));padding:20px 36px;min-height:60px;border-radius:100px;box-shadow:0 14px 34px -12px rgba(42,210,193,.5),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;text-align:center;line-height:1.2;text-decoration:none}
  .btn:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(42,210,193,.6),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}

  /* ================= 0 — atual ================= */
  .v0 .final{position:relative;padding:var(--section-space) 0;text-align:center;background:var(--bg)}
  .v0 .final::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(860px 520px at 50% 55%,rgba(0,251,138,.11),transparent 58%),radial-gradient(720px 420px at 50% 104%,rgba(42,210,193,.15),transparent 62%)}
  .v0 .final::after{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(42,210,193,.35),transparent)}
  .v0 .final .wrap{position:relative;max-width:960px}
  .v0 h2{font-size:clamp(1.875rem,3.4vw,3rem);line-height:1.15}
  .v0 .steps-line{max-width:660px;margin:28px auto 32px;color:var(--copy-readable);font-size:1.0625rem;line-height:1.75}
  .v0 .steps-line b{font-weight:500;color:var(--cream)}
  .v0 footer{border-top:1px solid var(--line);padding:40px 0;text-align:center;color:var(--muted-2);font-size:.82rem;background:var(--bg)}
  .v0 footer .brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;color:var(--cream);font-size:1.05rem;margin-bottom:10px}
  .v0 footer p{max-width:60ch;margin:0 auto 6px}
  .v0 footer .legal{margin-top:14px;font-size:.76rem}

  /* ===== propostas: encerramento e rodapé sobre o mesmo fundo ===== */
  .closing{position:relative;isolation:isolate;overflow:hidden;background:var(--bg)}
  .closing .final{position:relative;padding:clamp(96px,10vw,152px) 0 clamp(72px,7vw,104px);text-align:center}
  .closing .final .wrap{position:relative;z-index:2;max-width:980px}
  .closing h2{font-size:clamp(2.125rem,4.4vw,3.75rem);line-height:1.08}
  .closing h2 .lead{display:block;margin-bottom:.18em}
  .closing h2 .serif{display:block;line-height:1.12}
  .closing .steps-line{max-width:620px;margin:32px auto 0;color:var(--copy-readable);font-size:1.125rem;line-height:1.8;text-wrap:pretty}
  .closing .steps-line b{font-weight:600;color:var(--cream)}
  .closing .cta{position:relative;z-index:2;display:flex;justify-content:center}
  /* rodapé integrado: fio fino, marca + data numa linha, ressalva legível embaixo */
  .closing footer{position:relative;z-index:2;padding:0 0 40px}
  .closing footer .wrap{display:grid;gap:18px;padding-top:28px;border-top:1px solid rgba(42,53,116,.8)}
  .closing footer .row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
  .closing footer .brand{font-family:'Bricolage Grotesque',sans-serif;font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;color:var(--cream)}
  .closing footer .date{font-size:.875rem;color:var(--muted)}
  .closing footer .legal{max-width:78ch;font-size:.8125rem;line-height:1.65;color:var(--muted)}

  /* ================= A — batimento atravessando ================= */
  .vA .grid{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.55;background-image:linear-gradient(rgba(42,210,193,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(42,210,193,.06) 1px,transparent 1px);background-size:34px 34px;background-position:center top;-webkit-mask-image:radial-gradient(70% 62% at 50% 52%,#000,transparent 80%);mask-image:radial-gradient(70% 62% at 50% 52%,#000,transparent 80%)}
  .vA .glow{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(640px 300px at 50% 62%,rgba(0,251,138,.07),transparent 70%),radial-gradient(900px 420px at 50% 100%,rgba(42,210,193,.08),transparent 70%)}
  .vA .ecg{position:relative;z-index:1;height:120px;margin:40px 0 8px}
  .vA .ecg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .vA .ecg .mobile{display:none}
  .vA .ecg path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .vA .ecg .base{stroke:url(#ecgGrad);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 2.4s cubic-bezier(.45,.05,.2,1)}
  .vA .ecg .after{stroke:rgba(135,148,172,.28);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.6s cubic-bezier(.45,.05,.2,1) 2.2s}
  .vA .ecg .pulse{stroke:var(--mint-bright);stroke-width:2.5;stroke-dasharray:5 95;stroke-dashoffset:105;opacity:0;filter:drop-shadow(0 0 6px rgba(69,228,211,.8))}
  .vA.is-on .ecg .base,.vA.is-on .ecg .after{stroke-dashoffset:0}
  .vA.is-on .ecg .pulse{animation:ecgPulse 4.2s cubic-bezier(.55,.1,.35,1) 2.6s infinite}
  @keyframes ecgPulse{0%{stroke-dashoffset:105;opacity:0}8%{opacity:1}88%{opacity:1}100%{stroke-dashoffset:5;opacity:0}}
  /* destino do caminho: ponto verde-menta sobre o botão */
  .vA .dest{position:absolute;left:50%;top:60px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--virada);box-shadow:0 0 0 6px rgba(0,251,138,.12),0 0 22px rgba(0,251,138,.55);opacity:0;transform:scale(.4);transition:opacity .5s var(--ease-out) 2.1s,transform .6s var(--ease-out) 2.1s}
  .vA.is-on .dest{opacity:1;transform:none}
  .vA .dest::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:48px;margin-left:-.5px;background:linear-gradient(rgba(0,251,138,.5),transparent)}

  /* ================= B — foto de fundo ================= */
  .vB .photo{position:absolute;inset:0;z-index:0;overflow:hidden}
  .vB .photo img{position:absolute;left:0;top:var(--shift,0%);width:100%;height:100%;object-fit:cover;object-position:50% 50%;filter:saturate(.75) contrast(1.05);opacity:.72;transform:scale(1.08);transition:transform 2.6s cubic-bezier(.22,1,.36,1)}
  .vB.is-on .photo img{transform:scale(1)}
  .vB .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,rgba(8,12,34,.55) 22%,rgba(8,12,34,.3) 50%,rgba(8,12,34,.3) 70%,rgba(8,12,34,.82) 88%,var(--bg) 100%),radial-gradient(90% 70% at 50% 55%,transparent 35%,rgba(8,12,34,.85) 100%)}
  /* C1 — luz descida: o núcleo sai de trás do texto e fica na altura do botão */
  .vC1{--shift:30%}
  @media (max-width:900px){.vC1{--shift:22%}}
  /* C2 — luz escurecida: mesma posição, faixa do meio mais escura */
  .vC2 .photo::after{background:linear-gradient(180deg,var(--bg) 0%,rgba(8,12,34,.6) 22%,rgba(8,12,34,.55) 45%,rgba(8,12,34,.55) 70%,rgba(8,12,34,.85) 88%,var(--bg) 100%),radial-gradient(90% 70% at 50% 55%,transparent 35%,rgba(8,12,34,.85) 100%)}
  .vB .final h2{text-shadow:0 2px 30px rgba(8,12,34,.8)}
  .vB .steps-line{text-shadow:0 1px 18px rgba(8,12,34,.9)}
  .vB .cta{margin-top:40px}
  .vB .tag{position:absolute;top:16px;right:16px;z-index:3;padding:6px 12px;border:1.5px dashed rgba(236,240,248,.35);border-radius:999px;background:rgba(8,12,34,.6);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

  @media (max-width:560px){
    .closing .final{padding:80px 0 56px}
    .closing h2{font-size:2rem}
    .closing .steps-line{font-size:1rem;line-height:1.75}
    .closing .btn,.v0 .btn{width:100%;font-size:1rem;line-height:1.4;padding-inline:24px}
    .closing footer .row{flex-direction:column;gap:4px}
    .vA .ecg{margin-top:32px}
    .vA .ecg .desktop{display:none}
    .vA .ecg .mobile{display:block}
  }
  @media (prefers-reduced-motion:reduce){
    .vA .ecg .base,.vA .ecg .after{transition:none;stroke-dashoffset:0}
    .vA .ecg .pulse{display:none}
    .vA .dest{transition:none;opacity:1;transform:none}
    .vB .photo img{transition:none;transform:none}
  }
</style>
</head>
<body>

<header class="wrap intro">
  <h1>Encerramento + rodapé · duas linhas</h1>
  <p>Seção final e rodapé no tamanho real, com a copy idêntica à da página. Use o seletor para alternar. Role até o fim e volte para ver as animações de entrada. Veja também no celular.</p>
</header>

<div class="picker" role="group" aria-label="Versão do encerramento">
  <div class="wrap">
    <p>Encerramento</p>
    <div>
      <button type="button" data-pick="v0" aria-pressed="false"><b>0</b>Atual</button>
      <button type="button" data-pick="vA" aria-pressed="true"><b>A</b>Batimento atravessando</button>
      <button type="button" data-pick="vB" aria-pressed="false"><b>B</b>Mãos (atual na página)</button>
      <button type="button" data-pick="vC" aria-pressed="false"><b>C</b>Luz cirúrgica</button>
      <button type="button" data-pick="vC1" aria-pressed="false"><b>C1</b>Luz descida</button>
      <button type="button" data-pick="vC2" aria-pressed="false"><b>C2</b>Luz escurecida</button>
    </div>
  </div>
</div>
<p class="note" aria-live="polite"></p>

<div class="faq-tail">… fim do FAQ (“Ficou com alguma dúvida?”)</div>
<div class="slot"></div>

<script>
(() => {
  const H2 = 'Você já aprendeu a instrumentar.<br><span class="serif">Agora descubra o caminho entre a sua formação e a sua primeira oportunidade.</span>';
  const H2_SPLIT = '<span class="lead">Você já aprendeu a instrumentar.</span><span class="serif">Agora descubra o caminho entre a sua formação e a sua primeira oportunidade.</span>';
  const STEPS = 'Eu organizei essa jornada em 6 passos.<br><b>Talvez você já tenha percorrido alguns.</b> Talvez esteja travado em um deles. Talvez esteja mais perto do que imagina.<br>Mas primeiro você precisa descobrir <b>onde está.</b>';
  const CTA = '<a href="#oferta" class="btn">QUERO CONHECER OS 6 PASSOS DA VIRADA</a>';
  const DATE = 'Encontro ao vivo em 24 de setembro, às 20h — online e ao vivo.';
  const LEGAL = 'Este conteúdo tem caráter educativo e de direcionamento. Não há garantia de contratação, equipe, cirurgia ou prazo para resultados. Resultados podem variar de pessoa para pessoa.';
  const FOOTER = '<footer><div class="wrap"><div class="row"><p class="brand">Gancho da Virada</p><p class="date">' + DATE + '</p></div><p class="legal">' + LEGAL + '</p></div></footer>';

  // traço: plano, dois batimentos na aproximação e chegada ao centro (x=720), onde fica o destino
  const PATH_IN = 'M0 60 H300 L318 60 L330 44 L342 60 H430 L446 60 L458 20 L472 98 L486 60 L500 60 L510 50 L520 60 H590 L604 60 L614 28 L626 88 L638 60 L650 60 L658 54 L666 60 H720';
  const PATH_OUT = 'M720 60 H1440';
  const PATH_IN_M = 'M0 60 H60 L74 60 L84 34 L96 90 L108 60 L118 60 L124 52 L130 60 H200';
  const PATH_OUT_M = 'M200 60 H400';
  const ecg = '<div class="ecg" aria-hidden="true">'
    + '<svg class="desktop" viewBox="0 0 1440 120" preserveAspectRatio="none"><defs><linearGradient id="ecgGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="720" y2="0"><stop offset="0" stop-color="#5C6889" stop-opacity="0"/><stop offset=".35" stop-color="#24B7D3"/><stop offset="1" stop-color="#30EFAD"/></linearGradient></defs>'
    + '<path class="base" pathLength="100" d="' + PATH_IN + '"/><path class="after" pathLength="100" d="' + PATH_OUT + '"/><path class="pulse" pathLength="100" d="' + PATH_IN + '"/></svg>'
    + '<svg class="mobile" viewBox="0 0 400 120" preserveAspectRatio="none"><defs><linearGradient id="ecgGradM" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0"><stop offset="0" stop-color="#5C6889" stop-opacity="0"/><stop offset=".4" stop-color="#24B7D3"/><stop offset="1" stop-color="#30EFAD"/></linearGradient></defs>'
    + '<path class="base" style="stroke:url(#ecgGradM)" pathLength="100" d="' + PATH_IN_M + '"/><path class="after" pathLength="100" d="' + PATH_OUT_M + '"/><path class="pulse" pathLength="100" d="' + PATH_IN_M + '"/></svg>'
    + '<span class="dest"></span></div>';

  const VERSIONS = {
    v0: {
      note: 'Encerramento e rodapé atuais da página, para referência.',
      html: '<div class="v0"><section class="final"><div class="wrap"><h2>' + H2 + '</h2><p class="steps-line">' + STEPS + '</p>' + CTA + '</div></section><footer><div class="wrap"><div class="brand">Gancho da Virada</div><p>' + DATE + '</p><p class="legal">' + LEGAL + '</p></div></footer></div>'
    },
    vA: {
      note: 'Batimento atravessando: grade fina do mapa ao fundo; ao entrar na tela, a linha de ECG se desenha da esquerda até o centro, com dois batimentos, e termina num ponto verde-menta logo acima do botão (o “destino” do mapa). A partir dele, o caminho segue apagado até a borda. De tempos em tempos um pulso de luz percorre o traço. Rodapé no mesmo fundo, com a ressalva mais legível.',
      html: '<div class="closing vA"><div class="grid"></div><div class="glow"></div><section class="final"><div class="wrap"><h2>' + H2_SPLIT + '</h2><p class="steps-line">' + STEPS + '</p></div>' + ecg + '<div class="cta wrap">' + CTA + '</div></section>' + FOOTER + '</div>'
    },
    vB: {
      note: 'Mãos passando o instrumental: exatamente como está na página (mesmo tratamento de cor, degradês e vinheta, foto cobrindo a seção inteira).',
      html: '<div class="closing vB"><div class="photo"><img src="../../assets/images/encerramento-maos.webp" alt="" width="1672" height="941"></div><section class="final"><div class="wrap"><h2>' + H2_SPLIT + '</h2><p class="steps-line">' + STEPS + '</p></div><div class="cta wrap">' + CTA + '</div></section>' + FOOTER + '</div>'
    },
    vC: {
      note: 'Luz cirúrgica: mesmo tratamento da página, trocando só a imagem. Foco cirúrgico no centro, com o núcleo de luz atrás do fim do título; base da foto quase preta, então o rodapé fica bem limpo.',
      html: '<div class="closing vB vC"><div class="photo"><img src="../../assets/images/encerramento-luz.webp" alt="" width="1672" height="941"></div><section class="final"><div class="wrap"><h2>' + H2_SPLIT + '</h2><p class="steps-line">' + STEPS + '</p></div><div class="cta wrap">' + CTA + '</div></section>' + FOOTER + '</div>'
    },
    vC1: {
      note: 'Luz descida: mesma imagem e mesmo brilho; a foto desce (30% no desktop, 22% até 900px) para o núcleo de luz sair de trás do texto e ficar na altura do botão. Em cima dos textos ficam só as partes escuras da luminária.',
      html: '<div class="closing vB vC vC1"><div class="photo"><img src="../../assets/images/encerramento-luz.webp" alt="" width="1672" height="941"></div><section class="final"><div class="wrap"><h2>' + H2_SPLIT + '</h2><p class="steps-line">' + STEPS + '</p></div><div class="cta wrap">' + CTA + '</div></section>' + FOOTER + '</div>'
    },
    vC2: {
      note: 'Luz escurecida: mesma posição da C; só a faixa do meio do degradê fica mais escura (.3 → .55) para o texto ler melhor sobre o núcleo de luz.',
      html: '<div class="closing vB vC vC2"><div class="photo"><img src="../../assets/images/encerramento-luz.webp" alt="" width="1672" height="941"></div><section class="final"><div class="wrap"><h2>' + H2_SPLIT + '</h2><p class="steps-line">' + STEPS + '</p></div><div class="cta wrap">' + CTA + '</div></section>' + FOOTER + '</div>'
    }
  };

  const slot = document.querySelector('.slot');
  const note = document.querySelector('.note');
  const picks = document.querySelectorAll('[data-pick]');
  let io;
  const choose = key => {
    slot.innerHTML = VERSIONS[key].html;
    note.textContent = VERSIONS[key].note;
    picks.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pick === key)));
    const root = slot.firstElementChild;
    if (io) io.disconnect();
    if (root.classList.contains('closing')) {
      if ('IntersectionObserver' in window) {
        // entra ao aparecer e reinicia ao sair, para dar para rever a animação
        io = new IntersectionObserver(([en]) => root.classList.toggle('is-on', en.isIntersecting), { threshold: .3 });
        io.observe(root.querySelector('.final'));
      } else root.classList.add('is-on');
    }
    try { localStorage.setItem('closing-version', key); } catch (e) {}
  };
  picks.forEach(b => b.addEventListener('click', () => choose(b.dataset.pick)));
  let saved = 'vA';
  try { saved = localStorage.getItem('closing-version') || 'vA'; } catch (e) {}
  choose(VERSIONS[saved] ? saved : 'vA');
  document.addEventListener('click', e => { if (e.target.closest('a[href="#oferta"]')) e.preventDefault(); });
})();
</script>
</body>
</html>
