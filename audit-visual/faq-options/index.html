<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — variações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080C22;--bg-2:#0C1236;--surface:#141C4A;--line:#2A3574;--cream:#ECF0F8;--muted:#8794AC;--mint:#2AD2C1;--mint-bright:#45E4D3;--mint-deep:#1AA99B;--copy-readable:rgba(236,240,248,.82);--ease-out:cubic-bezier(.22,1,.36,1);--maxw:1160px;--section-space:clamp(64px,6.1vw,88px);--section-title:clamp(1.875rem,3.4vw,3rem)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--cream);font-family:'Hanken Grotesk',sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font:inherit;color:inherit}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* ===== moldura do comparador ===== */
  .intro{padding:32px 0 18px}
  .intro h1{font-family:'Bricolage Grotesque',sans-serif;font-size:1.375rem;font-weight:600;margin-bottom:6px}
  .intro p{color:var(--muted);font-size:.9375rem;max-width:860px}
  .picker{position:sticky;top:0;z-index:30;background:rgba(8,12,34,.92);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
  .picker .wrap{display:flex;align-items:center;gap:10px 14px;padding-block:10px;overflow-x:auto;scrollbar-width:none}
  .picker .wrap::-webkit-scrollbar{display:none}
  .picker p{flex:none;font-size:.8125rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .picker div{display:flex;gap:8px}
  .picker button{flex:none;white-space:nowrap;font-size:.875rem;background:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
  .picker button b{color:var(--mint-bright);margin-right:6px}
  .picker button:hover{border-color:var(--mint-deep)}
  .picker button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#06122E}
  .picker button[aria-pressed="true"] b{color:#06122E}
  .picker button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
  .note{max-width:var(--maxw);margin:0 auto;padding:14px 24px;color:var(--muted);font-size:.875rem;min-height:48px}
  @media (max-width:560px){.picker p{display:none}}

  /* ===== base da seção ===== */
  .sec-faq{position:relative;padding-block:var(--section-space);background:var(--bg);border-top:1px solid var(--line)}
  .kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mint);font-weight:600;margin-bottom:16px}
  h2{font-family:'Bricolage Grotesque',sans-serif;font-size:var(--section-title);font-weight:600;line-height:1.13;letter-spacing:-.025em;text-wrap:balance}
  .serif{font-family:'Fraunces',serif;font-style:italic;font-weight:500;color:var(--mint-bright)}
  .a b{font-weight:600;color:var(--cream)}
  .todo{color:var(--muted)}

  /* ícone + que vira − (a haste vertical deita) */
  .pm{position:relative;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg-2);transition:background .35s var(--ease-out),border-color .35s var(--ease-out)}
  .pm::before,.pm::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.75px;margin:-.875px 0 0 -6px;border-radius:2px;background:var(--mint-bright);transition:transform .45s var(--ease-out),background .35s}
  .pm::after{transform:rotate(90deg)}
  [open]>summary .pm,.is-open .pm{background:var(--mint);border-color:var(--mint)}
  [open]>summary .pm::before,[open]>summary .pm::after,.is-open .pm::before,.is-open .pm::after{background:var(--bg)}
  [open]>summary .pm::after,.is-open .pm::after{transform:rotate(0)}

  summary{list-style:none;cursor:pointer}
  summary::-webkit-details-marker{display:none}
  summary:focus-visible,.q-tab:focus-visible{outline:2px solid var(--mint);outline-offset:4px;border-radius:8px}

  /* ================= 0 — atual ================= */
  .v0>.wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:64px;align-items:start}
  .v0 .head{max-width:390px}
  .v0 h2 .serif{display:block}
  .v0 .list{border-top:1px solid var(--line)}
  .v0 details{border-bottom:1px solid var(--line)}
  .v0 summary{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px 0;font-family:'Bricolage Grotesque',sans-serif;font-size:1.125rem;font-weight:500;line-height:1.45}
  .v0 summary:hover{color:var(--mint-bright)}
  .v0 .pm{width:32px;height:32px}
  .v0 .a{padding:0 44px 24px 0;color:var(--copy-readable);line-height:1.7}

  /* ================= 1 — editorial com filete ================= */
  .v1>.wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:80px;align-items:start}
  .v1 .head{position:sticky;top:96px}
  .v1 h2{font-size:clamp(2.25rem,4.2vw,3.75rem);line-height:1.04}
  .v1 h2 .serif{display:block}
  .v1 .head::after{content:"";display:block;width:32px;height:2px;margin-top:28px;background:var(--mint)}
  .v1 .list{counter-reset:none}
  .v1 details{position:relative;border-top:1px solid var(--line);transition:background .45s var(--ease-out)}
  .v1 details:last-child{border-bottom:1px solid var(--line)}
  .v1 details::before{content:"";position:absolute;left:0;top:-1px;width:0;height:2px;background:var(--mint);transition:width .7s var(--ease-out)}
  .v1 details:hover::before{width:32px}
  .v1 details[open]::before{width:100%}
  .v1 summary{display:flex;justify-content:space-between;align-items:center;gap:32px;padding:30px 0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(1.1875rem,1.7vw,1.4375rem);font-weight:500;line-height:1.35;letter-spacing:-.015em;transition:color .3s,transform .45s var(--ease-out)}
  .v1 summary .q{transition:transform .45s var(--ease-out)}
  .v1 summary:hover .q{transform:translateX(6px)}
  .v1 details[open] summary{color:var(--cream)}
  .v1 .a{overflow:hidden}
  .v1 .a p{padding:0 72px 32px 0;max-width:60ch;font-size:1.0625rem;line-height:1.75;color:var(--copy-readable);text-wrap:pretty}

  /* ================= 2 — cartões em duas colunas ================= */
  .v2 .head{text-align:center;max-width:760px;margin:0 auto 48px}
  .v2 .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .v2 .col{display:grid;gap:16px}
  .v2 details{position:relative;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--bg-2),var(--bg));overflow:hidden;transition:border-color .4s var(--ease-out),box-shadow .5s var(--ease-out),transform .45s var(--ease-out)}
  .v2 details::before{content:"";position:absolute;top:0;left:28px;right:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(69,228,211,.7),transparent);opacity:0;transition:opacity .5s var(--ease-out)}
  .v2 details:hover{border-color:rgba(42,210,193,.35);transform:translateY(-2px)}
  .v2 details[open]{border-color:rgba(42,210,193,.45);box-shadow:0 30px 70px -40px rgba(0,0,0,.9);background:radial-gradient(420px 200px at 50% 0,rgba(42,210,193,.1),transparent 70%),linear-gradient(180deg,var(--surface),var(--bg-2))}
  .v2 details[open]::before{opacity:1}
  .v2 summary{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:100px;padding:24px 24px 24px 28px;font-family:'Bricolage Grotesque',sans-serif;font-size:1.125rem;font-weight:500;line-height:1.4;letter-spacing:-.01em}
  .v2 .a{overflow:hidden}
  .v2 .a p{margin:0 28px;padding:18px 0 26px;border-top:1px solid rgba(42,53,116,.8);font-size:1rem;line-height:1.7;color:var(--copy-readable);text-wrap:pretty}

  /* ================= 3 — índice + leitura ================= */
  .v3 .head{max-width:760px;margin-bottom:44px}
  .v3 .reader{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border:1px solid var(--line);border-radius:28px;background:var(--bg);overflow:hidden;box-shadow:0 60px 120px -50px rgba(0,0,0,.9)}
  .v3 .index{padding:16px;border-right:1px solid var(--line);background:var(--bg-2)}
  .v3 .q-tab{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:18px 20px;border:0;border-radius:14px;background:none;text-align:left;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-size:1rem;font-weight:500;line-height:1.4;color:var(--muted);transition:color .3s,background .35s var(--ease-out)}
  .v3 .q-tab+.q-tab{margin-top:2px}
  .v3 .q-tab::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;border-radius:2px;background:var(--mint);transform:scaleY(0);transition:transform .45s var(--ease-out)}
  .v3 .q-tab:hover{color:var(--cream);background:rgba(20,28,74,.6)}
  .v3 .q-tab[aria-selected="true"]{color:var(--cream);background:var(--surface)}
  .v3 .q-tab[aria-selected="true"]::before{transform:scaleY(1)}
  .v3 .q-tab .arr{flex:none;width:18px;height:18px;color:var(--mint-bright);opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .45s var(--ease-out)}
  .v3 .q-tab[aria-selected="true"] .arr{opacity:1;transform:none}
  .v3 .panel{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:460px;padding:56px 64px;background:radial-gradient(520px 320px at 100% 0,rgba(42,210,193,.08),transparent 70%)}
  .v3 .panel-inner{transition:opacity .3s var(--ease-out),transform .45s var(--ease-out)}
  .v3 .panel.is-swapping .panel-inner{opacity:0;transform:translateY(10px)}
  .v3 .panel h3{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(1.75rem,2.6vw,2.25rem);font-weight:600;line-height:1.15;letter-spacing:-.025em;text-wrap:balance;max-width:22ch}
  .v3 .panel h3::after{content:"";display:block;width:32px;height:2px;margin:26px 0 22px;background:var(--mint)}
  .v3 .panel p{max-width:52ch;font-size:1.125rem;line-height:1.75;color:var(--copy-readable);text-wrap:pretty}
  .v3 .mobile{display:none}

  @media (max-width:900px){
    .v0>.wrap,.v1>.wrap{grid-template-columns:minmax(0,1fr);gap:32px}
    .v0 h2 .serif{display:inline}
    .v1 .head{position:static}
    .v1 h2{font-size:clamp(2rem,7vw,2.75rem)}
    .v2 .grid{grid-template-columns:minmax(0,1fr)}
    .v3 .reader{display:none}
    .v3 .mobile{display:block}
  }
  @media (max-width:560px){
    .v0 summary{font-size:1.0625rem;gap:16px;padding:20px 0}
    .v0 .a{padding:0 0 24px}
    .v1 summary{gap:20px;padding:24px 0;font-size:1.125rem}
    .v1 .a p{padding:0 0 26px;font-size:1rem}
    .v1 .pm,.v2 .pm{width:32px;height:32px}
    .v2 .head{text-align:left;margin-bottom:32px}
    .v2 details{border-radius:18px}
    .v2 summary{min-height:0;padding:20px 18px 20px 20px;font-size:1.0625rem;gap:14px}
    .v2 .a p{margin:0 20px}
  }
</style>
</head>
<body>

<header class="wrap intro">
  <h1>Dúvidas · três propostas para o FAQ</h1>
  <p>Seção no tamanho real, com as mesmas 6 perguntas e respostas (inclusive o placeholder da gravação). Use o seletor para alternar entre a atual e as propostas; clique nas perguntas para ver a abertura animada. Veja também no celular.</p>
</header>

<div class="picker" role="group" aria-label="Versão do FAQ">
  <div class="wrap">
    <p>FAQ</p>
    <div>
      <button type="button" data-pick="v0" aria-pressed="false"><b>0</b>Atual</button>
      <button type="button" data-pick="v1" aria-pressed="true"><b>1</b>Editorial com filete</button>
      <button type="button" data-pick="v2" aria-pressed="false"><b>2</b>Cartões em duas colunas</button>
      <button type="button" data-pick="v3" aria-pressed="false"><b>3</b>Índice + leitura</button>
    </div>
  </div>
</div>
<p class="note" aria-live="polite"></p>

<div class="slot"></div>

<script>
(() => {
  const FAQ = [
    ['O Gancho da Virada garante que vou conseguir uma equipe?', '<b>Não.</b> O Gancho apresenta direcionamento e uma jornada estruturada para ajudar você a compreender os movimentos envolvidos na construção do seu espaço no mercado. Não existe garantia de contratação, equipe, cirurgia ou prazo para resultados.'],
    ['Vou aprender técnicas de instrumentação cirúrgica?', 'O Gancho não substitui sua formação técnica. O foco está justamente no que acontece <b>depois da formação</b> e no caminho de entrada no mercado.'],
    ['Quando recebo as 3 aulas?', '<b>Imediatamente após a confirmação da inscrição.</b>'],
    ['Quando vou conhecer os 6 passos?', 'O <b>Mapa dos 6 Passos da Virada</b> será revelado e explicado durante o encontro ao vivo.'],
    ['O encontro ficará gravado?', '<span class="todo">[DEFINIR RESPOSTA — informar se o encontro ao vivo ficará disponível gravado e por quanto tempo.]</span>'],
    ['Ainda estou terminando minha formação. Posso participar?', '<b>Sim.</b> Se você está próximo de concluir sua formação e quer começar a compreender a jornada de entrada no mercado, também pode participar.']
  ];
  const head = '<p class="kicker">Dúvidas</p><h2>Ficou com <span class="serif">alguma dúvida?</span></h2>';
  const pm = '<span class="pm" aria-hidden="true"></span>';
  const arr = '<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
  const item = ([q, a]) => '<details><summary><span class="q">' + q + '</span>' + pm + '</summary><div class="a"><p>' + a + '</p></div></details>';

  const VERSIONS = {
    v0: {
      note: 'FAQ atual da página, para referência.',
      html: '<section class="sec-faq v0"><div class="wrap"><div class="head">' + head + '</div><div class="list">' + FAQ.map(item).join('') + '</div></div></section>'
    },
    v1: {
      note: 'Editorial com filete: título maior e fixo à esquerda enquanto as perguntas rolam; perguntas maiores; no hover a pergunta avança e um filete turquesa aparece; aberta, o filete percorre a linha inteira. Abertura com altura animada e “+” que vira “−”.',
      html: '<section class="sec-faq v1"><div class="wrap"><div class="head">' + head + '</div><div class="list">' + FAQ.map(item).join('') + '</div></div></section>'
    },
    v2: {
      note: 'Cartões em duas colunas: título centralizado e cada pergunta num cartão arredondado (3 + 3). Aberto, o cartão ganha fundo mais claro, borda turquesa e um fio de luz no topo; a resposta entra separada por um fio. No celular vira uma coluna.',
      html: '<section class="sec-faq v2"><div class="wrap"><div class="head">' + head + '</div><div class="grid"><div class="col">' + FAQ.slice(0, 3).map(item).join('') + '</div><div class="col">' + FAQ.slice(3).map(item).join('') + '</div></div></div></section>'
    },
    v3: {
      note: 'Índice + leitura: um painel único. À esquerda, o índice das perguntas; à direita, a pergunta escolhida em destaque com filete e a resposta em corpo grande, com troca suave. No celular vira a sanfona da versão 1.',
      html: '<section class="sec-faq v3"><div class="wrap"><div class="head">' + head + '</div>'
        + '<div class="reader"><div class="index" role="tablist" aria-orientation="vertical" aria-label="Perguntas frequentes">'
        + FAQ.map(([q], i) => '<button class="q-tab" type="button" role="tab" id="faq-tab-' + i + '" aria-controls="faq-panel" aria-selected="' + (i === 0) + '" tabindex="' + (i === 0 ? 0 : -1) + '"><span>' + q + '</span>' + arr + '</button>').join('')
        + '</div><div class="panel" id="faq-panel" role="tabpanel" aria-labelledby="faq-tab-0"><div class="panel-inner"><h3>' + FAQ[0][0] + '</h3><p>' + FAQ[0][1] + '</p></div></div></div>'
        + '<div class="mobile v1-like">' + FAQ.map(item).join('') + '</div></div></section>'
    }
  };

  const calm = matchMedia('(prefers-reduced-motion: reduce)');

  // abertura e fechamento com altura animada nos <details>
  const wireDetails = root => {
    root.querySelectorAll('details').forEach(d => {
      const summary = d.querySelector('summary');
      const body = d.querySelector('.a');
      summary.addEventListener('click', e => {
        if (calm.matches) return;
        e.preventDefault();
        if (d.dataset.busy) return;
        d.dataset.busy = '1';
        if (!d.open) {
          d.open = true;
          const h = body.scrollHeight;
          body.animate([{ height: '0px', opacity: 0 }, { height: h + 'px', opacity: 1 }], { duration: 460, easing: 'cubic-bezier(.22,1,.36,1)' })
            .onfinish = () => { delete d.dataset.busy; };
        } else {
          const h = body.scrollHeight;
          // fill: forwards segura a altura zero até o <details> fechar (sem piscar a resposta)
          const anim = body.animate([{ height: h + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 320, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
          anim.onfinish = () => { d.open = false; anim.cancel(); delete d.dataset.busy; };
        }
      });
    });
  };

  // índice + leitura (versão 3)
  const wireReader = root => {
    const tabs = [...root.querySelectorAll('.q-tab')];
    if (!tabs.length) return;
    const panel = root.querySelector('.panel');
    const inner = panel.querySelector('.panel-inner');
    const select = (i, focus) => {
      tabs.forEach((t, j) => { t.setAttribute('aria-selected', String(j === i)); t.tabIndex = j === i ? 0 : -1; });
      panel.setAttribute('aria-labelledby', tabs[i].id);
      if (focus) tabs[i].focus();
      const paint = () => { inner.innerHTML = '<h3>' + FAQ[i][0] + '</h3><p>' + FAQ[i][1] + '</p>'; };
      if (calm.matches) { paint(); return; }
      panel.classList.add('is-swapping');
      setTimeout(() => { paint(); void inner.offsetWidth; panel.classList.remove('is-swapping'); }, 220);
    };
    tabs.forEach((t, i) => {
      t.addEventListener('click', () => { if (t.getAttribute('aria-selected') !== 'true') select(i); });
      t.addEventListener('keydown', e => {
        const k = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
        if (k) { e.preventDefault(); select((i + k + tabs.length) % tabs.length, true); }
        if (e.key === 'Home') { e.preventDefault(); select(0, true); }
        if (e.key === 'End') { e.preventDefault(); select(tabs.length - 1, true); }
      });
    });
  };

  const slot = document.querySelector('.slot');
  const note = document.querySelector('.note');
  const picks = document.querySelectorAll('[data-pick]');
  const choose = key => {
    slot.innerHTML = VERSIONS[key].html;
    note.textContent = VERSIONS[key].note;
    picks.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pick === key)));
    if (key === 'v3') slot.querySelector('.mobile').classList.add('v1');
    wireDetails(slot);
    wireReader(slot);
    try { localStorage.setItem('faq-version', key); } catch (e) {}
  };
  picks.forEach(b => b.addEventListener('click', () => choose(b.dataset.pick)));
  let saved = 'v1';
  try { saved = localStorage.getItem('faq-version') || 'v1'; } catch (e) {}
  choose(VERSIONS[saved] ? saved : 'v1');
})();
</script>
</body>
</html>
